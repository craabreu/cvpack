name: Linux

on:
  # GitHub has started calling new repo's first branch "main" https://github.com/github/renaming
  # The cookiecutter uses the "--initial-branch" flag when it runs git-init
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  schedule:
    # Weekly tests run on main by default:
    #   Scheduled workflows run on the latest commit on the default or base branch.
    #   (from https://help.github.com/en/actions/reference/events-that-trigger-workflows#scheduled-events-schedule)
    - cron: "0 0 * * 0"
  # Lets the release workflows run the test suite before deploying
  workflow_call:
    inputs:
      ref:
        description: "Git ref to test"
        required: false
        type: string
        default: ""

jobs:
  test:
    name: Test on ${{ matrix.os }}, Python ${{ matrix.python-version }}, OpenMM ${{ matrix.openmm-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.14"
            openmm-version: "8.6"
            cpp-forces: true

          - os: ubuntu-latest
            python-version: "3.13"
            openmm-version: "8.6"

          - os: ubuntu-latest
            python-version: "3.12"
            openmm-version: "8.5"
            cpp-forces: true

          - os: ubuntu-latest
            python-version: "3.11"
            openmm-version: "8.4"

          - os: ubuntu-latest
            python-version: "3.10"
            openmm-version: "8.4"
            cpp-forces: true

          - os: ubuntu-latest
            python-version: "3.12"
            openmm-version: "8.1"
            # The openmmtools version compatible with OpenMM 8.1 imports pkg_resources,
            # which setuptools removed in version 82
            extra-specs: setuptools=81

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/test_env.yaml
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}
            openmm=${{ matrix.openmm-version }}
            ${{ matrix.extra-specs }}

      - name: Install package
        # conda setup requires this special shell
        shell: bash -l {0}
        run: |
          if [ "${{ matrix.cpp-forces }}" == "true" ]; then
            # Needed by CompositeRMSD. Versions before 0.2.0 give wrong forces.
            micromamba install -y -c mdtools "openmm-cpp-forces>=0.2"
          fi
          python -m pip install . --no-deps
          micromamba list

      - name: Run tests
        # conda setup requires this special shell
        shell: bash -l {0}
        run: |
          pytest

      - name: CodeCov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.os }}-py${{ matrix.python-version }}
