name: PyPI

on:
  release:
    types: [published]
  # Rebuild and upload the distribution of an existing release tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, such as v0.12.2"
        required: true

jobs:
  tests:
    # Prereleases are not deployed
    if: github.event_name != 'release' || !github.event.release.prerelease
    uses: ./.github/workflows/Linux.yaml
    with:
      ref: ${{ inputs.tag || github.ref }}

  deploy:
    name: Build and upload on ${{ matrix.os }}, Python ${{ matrix.python-version }}
    needs: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Additional info about the build
        shell: bash
        run: |
          uname -a
          df -h
          ulimit -a

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: devtools/conda-envs/deployment_env.yaml
          environment-name: test
          create-args: >-
            python=${{ matrix.python-version }}

      - name: Install package
        shell: bash -l {0}
        run: |
          python -m pip install . --no-deps
          micromamba list

      - name: PyPI Build and Upload
        shell: bash -l {0}
        run: |
          echo "::group::Building PyPI distribution for cvpack ${{ inputs.tag || github.event.release.tag_name }}"
          python -m build
          python -m twine upload -u __token__ -p ${{ secrets.PYPI_TOKEN }} --repository pypi --skip-existing dist/*
          echo "::endgroup::"
